name: CI - User Service

on:
  push:
    branches:
      - staging-v1.1.0
    paths:
      - "user-service/**"
      - ".github/workflows/ci-user-service.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: user-service/pom.xml

      - name: Build JAR with Maven
        working-directory: user-service
        run: mvn clean package -DskipTests -B

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        working-directory: user-service
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/user-service
        run: |
          docker build -t "$IMAGE_NAME:staging-${{ github.sha }}" -t "$IMAGE_NAME:staging-latest" .
          docker push "$IMAGE_NAME:staging-${{ github.sha }}"
          docker push "$IMAGE_NAME:staging-latest"